info:
  name: GET Collection
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/collections?manhwaId={{manhwaId}}&_sort=releaseDate&_order=asc"
  params:
    - name: manhwaId
      value: "{{manhwaId}}"
      type: query
    - name: _sort
      value: releaseDate
      type: query
    - name: _order
      value: asc
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
