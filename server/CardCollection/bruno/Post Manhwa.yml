http:
  method: POST
  url: "{{baseUrl}}/manhwa"
  body:
    type: json
    data: |-
      { "title": { "romaji": "Test", "english": null }, "description": "…",
        "coverImage": { "large": "{{imagePath}}" }, "episodes": null, "averageScore": null, "genres": ["Action"] }
